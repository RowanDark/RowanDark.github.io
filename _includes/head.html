<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  {% assign page_title = page.title | default: site.title %}
  {% assign page_description = page.description | default: site.description %}

  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_description }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <!-- Favicons -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/images/favicon-192.png' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/images/favicon-512.png' | relative_url }}" />
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}" />
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}" />
  <meta name="theme-color" content="#0B0C0F" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:title" content="{{ page_title }}" />
  <meta property="og:description" content="{{ page_description }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:image" content="{{ '/assets/images/og-card.png' | absolute_url }}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page_title }}" />
  <meta name="twitter:description" content="{{ page_description }}" />
  <meta name="twitter:image" content="{{ '/assets/images/og-card.png' | absolute_url }}" />

  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/rosec.css' | relative_url }}">

  <!-- Measures the scrollbar's width so full-bleed bands (.hero,
       .cta-band, .band) can subtract it from 100vw and never overflow
       the visible viewport. Runs before first paint; harmless with JS
       disabled since --sbw already has a 0px fallback in CSS. -->
  <script>
    (function () {
      function setScrollbarWidth() {
        var sbw = window.innerWidth - document.documentElement.clientWidth;
        document.documentElement.style.setProperty('--sbw', sbw + 'px');
      }
      setScrollbarWidth();
      window.addEventListener('resize', setScrollbarWidth);
    })();
  </script>
</head>
