<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">✕</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="" />
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<script>
  var lightboxLastFocused = null;

  function openLightbox(src, caption) {
    lightboxLastFocused = document.activeElement;

    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox-img').alt = caption;
    document.getElementById('lightbox-caption').textContent = caption;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';

    document.querySelector('.lightbox-close').focus();
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';

    if (lightboxLastFocused) {
      lightboxLastFocused.focus();
      lightboxLastFocused = null;
    }
  }

  function getLightboxFocusable() {
    var lightbox = document.getElementById('lightbox');
    return Array.prototype.filter.call(
      lightbox.querySelectorAll('button, [href], img[tabindex]'),
      // offsetParent is always null for position:fixed elements (which the
      // lightbox and its close button are), so it can't be used as a
      // visibility check here — getClientRects() works for fixed elements.
      function (el) { return el.getClientRects().length > 0; }
    );
  }

  document.addEventListener('keydown', function (e) {
    var lightbox = document.getElementById('lightbox');
    if (!lightbox.classList.contains('open')) return;

    if (e.key === 'Escape') {
      closeLightbox();
      return;
    }

    if (e.key === 'Tab') {
      var focusable = getLightboxFocusable();
      if (focusable.length === 0) return;

      var first = focusable[0];
      var last = focusable[focusable.length - 1];

      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });

  // Prevent click on image itself from closing
  document.getElementById('lightbox-img').addEventListener('click', function (e) {
    e.stopPropagation();
  });
</script>
