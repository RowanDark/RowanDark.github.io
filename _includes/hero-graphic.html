<svg class="hero-graphic-svg" viewBox="0 -20 440 330" role="img" aria-labelledby="asgTitle asgDesc" focusable="false">
  <title id="asgTitle">External attack surface map</title>
  <desc id="asgDesc">
    A diagram of one root domain fanning out to five subdomains, which fan
    out to sixteen live hosts. Most hosts are informational or low severity.
    Two are marked high severity: an exposed admin panel and outdated TLS.
  </desc>

  <defs>
    <filter id="asgHalo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.75" />
    </filter>
  </defs>

  <g class="asg-tier-labels">
    <text x="0" y="-6" text-anchor="start">root domain</text>
    <text x="150" y="-6" text-anchor="middle">subdomains</text>
    <text x="300" y="-6" text-anchor="middle">live hosts</text>
  </g>

  <g class="asg-edges" fill="none" stroke-width="1" opacity=".45">
    <path class="asg-edge" pathLength="100" style="animation-delay:0ms"   d="M20,150 C85,150 85,40  150,40" />
    <path class="asg-edge" pathLength="100" style="animation-delay:40ms"  d="M20,150 C85,150 85,95  150,95" />
    <path class="asg-edge" pathLength="100" style="animation-delay:80ms"  d="M20,150 C85,150 85,150 150,150" />
    <path class="asg-edge" pathLength="100" style="animation-delay:120ms" d="M20,150 C85,150 85,205 150,205" />
    <path class="asg-edge" pathLength="100" style="animation-delay:160ms" d="M20,150 C85,150 85,260 150,260" />

    <path class="asg-edge" pathLength="100" style="animation-delay:260ms" d="M150,40  C225,40  225,20  300,20" />
    <path class="asg-edge" pathLength="100" style="animation-delay:300ms" d="M150,40  C225,40  225,50  300,50" />
    <path class="asg-edge" pathLength="100" style="animation-delay:340ms" d="M150,95  C225,95  225,80  300,80" />
    <path class="asg-edge" pathLength="100" style="animation-delay:380ms" d="M150,95  C225,95  225,110 300,110" />
    <path class="asg-edge" pathLength="100" style="animation-delay:420ms" d="M150,150 C225,150 225,140 300,140" />
    <path class="asg-edge" pathLength="100" style="animation-delay:460ms" d="M150,150 C225,150 225,170 300,170" />
    <path class="asg-edge" pathLength="100" style="animation-delay:500ms" d="M150,205 C225,205 225,200 300,200" />
    <path class="asg-edge" pathLength="100" style="animation-delay:540ms" d="M150,205 C225,205 225,230 300,230" />
    <path class="asg-edge" pathLength="100" style="animation-delay:580ms" d="M150,260 C225,260 225,260 300,260" />
    <path class="asg-edge" pathLength="100" style="animation-delay:620ms" d="M150,260 C225,260 225,290 300,290" />
  </g>

  <circle class="asg-node asg-node--root" cx="20" cy="150" r="6" style="animation-delay:900ms" />

  <circle class="asg-node asg-node--info" cx="150" cy="40"  r="4.5" style="animation-delay:920ms" />
  <circle class="asg-node asg-node--info" cx="150" cy="95"  r="4.5" style="animation-delay:940ms" />
  <circle class="asg-node asg-node--med"  cx="150" cy="150" r="4.5" style="animation-delay:960ms" />
  <circle class="asg-node asg-node--info" cx="150" cy="205" r="4.5" style="animation-delay:980ms" />
  <circle class="asg-node asg-node--info" cx="150" cy="260" r="4.5" style="animation-delay:1000ms" />

  <circle class="asg-node asg-node--info" cx="300" cy="20"  r="4.5" style="animation-delay:1020ms" />
  <circle class="asg-node asg-node--med"  cx="300" cy="50"  r="4.5" style="animation-delay:1040ms" />
  <circle class="asg-node asg-node--info" cx="300" cy="80"  r="4.5" style="animation-delay:1060ms" />

  <circle class="asg-halo" cx="300" cy="110" r="12" filter="url(#asgHalo)" style="animation-delay:1080ms" />
  <circle class="asg-node asg-node--high" cx="300" cy="110" r="6.5" style="animation-delay:1080ms" />
  <text class="asg-node-label" x="311" y="113">exposed admin panel</text>

  <circle class="asg-node asg-node--info" cx="300" cy="140" r="4.5" style="animation-delay:1100ms" />
  <circle class="asg-node asg-node--med"  cx="300" cy="170" r="4.5" style="animation-delay:1120ms" />
  <circle class="asg-node asg-node--info" cx="300" cy="200" r="4.5" style="animation-delay:1140ms" />
  <circle class="asg-node asg-node--med"  cx="300" cy="230" r="4.5" style="animation-delay:1160ms" />

  <circle class="asg-halo" cx="300" cy="260" r="12" filter="url(#asgHalo)" style="animation-delay:1180ms" />
  <circle class="asg-node asg-node--high" cx="300" cy="260" r="6.5" style="animation-delay:1180ms" />
  <text class="asg-node-label" x="311" y="263">outdated TLS</text>

  <circle class="asg-node asg-node--info" cx="300" cy="290" r="4.5" style="animation-delay:1200ms" />
</svg>
